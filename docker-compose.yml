version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: capsula-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: capsula
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capsula_dev_password}
      POSTGRES_DB: capsula
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsula -d capsula"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - capsula-network

  # ==========================================
  # Telegram Bot (Webhook mode)
  # ==========================================
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      args:
        - NODE_ENV=production
    container_name: capsula-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook}
      DATABASE_URL: postgresql://capsula:${POSTGRES_PASSWORD:-capsula_dev_password}@db:5432/capsula
      PORT: ${BOT_PORT:-3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${BOT_PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - capsula-network

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  capsula-network:
    driver: bridge